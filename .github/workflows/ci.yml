name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      # The superuser URL: the unit suites make their own scratch schema, and the
      # coretest suite (coresuite/) makes and drops its own databases and roles.
      TOGAVSU_TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: test
        if: ${{ !cancelled() }}
        # -timeout 0 turns off go test's default limit.
        run: go test -race -timeout 0 ./...
      # The core's install checks on the package, holding back the parts
      # package/pending.yaml lists that the pinned core refuses. Prints each held part
      # with its CORE item; fails on any refusal pending.yaml doesn't cover.
      - name: package check
        if: ${{ !cancelled() }}
        run: go run github.com/CharitonMedia/togavsu/cmd/togavsu-module check -installable package
